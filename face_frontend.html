<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>

<!-- Navbar -->
<header class="header">
    <div class="logo-container">
        <h2 class="logo-text">Schoolopedia</h2>
        <a href="{{ url_for('home') }}" class="home-button">Home</a>
    </div>
</header>

<h2 class="heading text-center mt-4">Face Recognition Attendance System</h2>

<div class="container mt-4 p-4 border rounded shadow">
    <div class="row">
        <!-- Left Side: Camera -->
        <div class="col-md-6 text-center">
            <div class="recognizedCon video-container rounded border p-3 shadow-lg bg-white">
                <video id="video" autoplay class="rounded" style="width:100%; max-height:360px;"></video>
            </div>
            <h5 class="text-center text-warning mt-3">
                👁 Please blink once before clicking <strong>"Recognize Face"</strong>
            </h5>
            <button class="btn btn-primary mt-3" onclick="recognizeFace()">Recognize Face</button>
        </div>

        <!-- Right Side: Recognized Students -->
        <div class="col-md-6">
            <h3 class="text-center">Recognized Students</h3>
            <div id="studentsList" class="row g-3"></div>
        </div>
    </div>
</div>

<script>
    function startCamera() {
        const video = document.getElementById("video");
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(error => {
                console.error("Error accessing the camera:", error);
            });
    }

    function recognizeFace() {
        const video = document.getElementById("video");
        const studentsList = document.getElementById("studentsList");

        studentsList.innerHTML = "<p class='text-center text-muted'>Recognizing... 👁</p>";

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append("image", blob);

            fetch('/recognize', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                studentsList.innerHTML = "";
                if (data.error) {
                    studentsList.innerHTML = `
                        <div class="alert alert-danger text-center" role="alert">
                            ${data.error}
                        </div>`;
                } else if (data.recognized_students.length === 0) {
                    studentsList.innerHTML = `
                        <div class="alert alert-warning text-center" role="alert">
                            No students recognized.
                        </div>`;
                } else {
                    data.recognized_students.forEach(student => {
                        const studentCard = document.createElement("div");
                        studentCard.className = "col-md-6";
                        studentCard.innerHTML = `
                            <div class="card shadow-sm p-3">
                                <h5 class="card-title text-center">${student.name}</h5>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item"><strong>Total Attendance:</strong> ${student.total_attendance}</li>
                                    <li class="list-group-item"><strong>Last Attendance:</strong> ${student.last_attendance_time}</li>
                                    <li class="list-group-item"><strong>Major:</strong> ${student.major}</li>
                                    <li class="list-group-item"><strong>Section:</strong> ${student.section}</li>
                                    <li class="list-group-item"><strong>Starting Year:</strong> ${student.starting_year}</li>
                                </ul>
                            </div>`;
                        studentsList.appendChild(studentCard);
                    });
                }
            })
            .catch(error => {
                console.error("Error recognizing face:", error);
                studentsList.innerHTML = `
                    <div class="alert alert-danger text-center" role="alert">
                        Error recognizing face. Please try again.
                    </div>`;
            });
        }, "image/png");
    }

    window.onload = startCamera;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
