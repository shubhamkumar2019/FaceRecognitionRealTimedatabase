<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Face Recognition System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      color: white;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 60px;
      background: black;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0px 2px 10px rgba(0, 150, 255, 0.5);
      z-index: 1000;
      flex-wrap: wrap;
    }

    .logo-container a {
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      margin-right: 30px;
    }

    .home-button {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 8px 15px;
      transition: 0.3s;
      white-space: nowrap;
    }

    .home-button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
    }

    .image-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding-top: 60px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: calc(100vh - 60px);
      object-fit: cover;
      display: block;
    }

    .text-overlay {
      position: absolute;
      top: 40%;
      left: 1%;
      width: 35%;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.6;
      box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.2);
    }

    .about-heading {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 26px;
      font-weight: bold;
      color: #00ccff;
    }

    .animated-lines {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      pointer-events: none;
    }

    .line {
      position: absolute;
      width: 60px;
      height: 2px;
      background: rgba(0, 150, 255, 0.8);
      opacity: 0;
      animation: moveLines 3s infinite linear;
    }

    @keyframes moveLines {
      0% { transform: translateX(-20px); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(20px); opacity: 0; }
    }

    .start-box-button {
      position: absolute;
      top: 47%;
      left: 44%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .start-button {
      padding: 10px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background: #00ccff;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 204, 255, 0.5);
      transition: background 0.3s ease;
    }

    .start-button:hover {
      background: #008fb3;
    }

    .white-section {
      width: 100%;
      height: 70vh;
      background: FloralWhite;
      color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 22px;
      padding: 20px;
      box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.2);
    }

    .benefits-container {
      width: 80%;
      height: 80%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .benefits-image {
      width: 90%;
      max-height: 90%;
      object-fit: cover;
    }

    .contact-section {
      width: 100%;
      height: 25vh;
      background: #222;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      padding: 20px;
      box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.3);
    }

    .contact-info {
      font-size: 18px;
      margin-top: 10px;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .nav {
        justify-content: center;
        width: 100%;
        margin-top: 10px;
      }

      .home-button {
        font-size: 1rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo-container">
    <h2 style="margin: 0; color: white;">Schoolopedia</h2>
  </div>
  <nav class="nav">
    <a href="{{url_for('home')}}" class="home-button">Home</a>
    <a href="1b.html" class="home-button">About</a>
    <a href="1c.html" class="home-button">Teacher</a>
  </nav>
</header>

<!-- First Section (Face Recognition) -->
<div class="image-container">
  <img src="{{ url_for('static', filename='front.jpg') }}" alt="Face Recognition" />

  <div class="start-box-button">
    <a href="./face_recognition_frontend.html" class="start-button">Start</a>
  </div>

  <div class="animated-lines" id="linesContainer"></div>
</div>

<!-- White Section with Benefits Image -->
<div class="white-section fade-in">
  <div class="benefits-container">
    <img src="{{ url_for('static', filename='benefits.jpg') }}" alt="Benefits of Face Recognition" class="benefits-image" />
  </div>
</div>

<!-- Contact Section -->
<div class="contact-section fade-in">
  <h2>Contact Us</h2>
  <p class="contact-info">📧 Email: miniprojectgroup16@gmail.com</p>
  <p class="contact-info">📞 Phone: +91 5226763838</p>
</div>

<!-- Audio Element -->
<audio id="start-sound" src="{{ url_for('static', filename='blink.mp3') }}" preload="auto"></audio>

<!-- JavaScript -->
<script>
  const linesContainer = document.getElementById('linesContainer');
  for (let i = 0; i < 100; i++) {
    let line = document.createElement('div');
    line.classList.add('line');

    let randomTop = Math.random() * 100;
    let randomLeft = 40 + Math.random() * 50;
    let randomDelay = Math.random() * 2;

    line.style.top = `${randomTop}%`;
    line.style.left = `${randomLeft}%`;
    line.style.animationDelay = `${randomDelay}s`;

    linesContainer.appendChild(line);
  }

  const startButton = document.querySelector(".start-button");
  const startSound = document.getElementById("start-sound");

  startButton.addEventListener("click", function (e) {
    e.preventDefault();
    startSound.play();
    setTimeout(() => {
      window.location.href = startButton.getAttribute("href");
    }, 500);
  });
</script>

</body>
</html>
